[defaults]
inventory           = inventory/hosts
roles_path          = roles
# Pinned collections are installed here (see requirements.yml); they are
# searched before any other copy, so the project always uses its own versions.
collections_path    = collections
retry_files_enabled = False
interpreter_python  = auto_silent
forks               = 5
# vault_password_file = inventory/.vault_pass.txt

[persistent_connection]
command_timeout = 180
connect_timeout = 60
