# Routing Identifiers
host_name: "P02_xe"
router_id: "10.0.0.11"
isis_proc: CORE
sid_id: "16011"
isis_net: "49.0001.0000.0000.0011.00"

# 1. Layer 1 / Layer 2 Interface Properties (cisco.ios.ios_interfaces)
l2_interfaces:
  - name: Loopback0
    description: "Router_id"
    enabled: true

  - name: Port-channel12
    description: "TO_PE01_9k"
    enabled: true

  - name: GigabitEthernet2
    description: "TO_PE01_9k- LAG Member BE12"
    enabled: true

  - name: Port-channel11
    description: "TO_P01_9k"
    enabled: true

  - name: GigabitEthernet3
    description: "TO_P01_9k - LAG Member BE11"
    enabled: true

  - name: GigabitEthernet1
    description: "TO_RR"
    enabled: true

  - name: GigabitEthernet4
    description: "Out-of-Band Management"
    enabled: true

# 2. Layer 3 IP Properties in CIDR notation (cisco.ios.ios_l3_interfaces)
l3_interfaces:
  - name: Loopback0
    ipv4:
      - address: 10.0.0.11/32

  - name: Port-channel11
    ipv4:
      - address: 10.1.11.2/30

  - name: Port-channel12
    ipv4:
      - address: 10.11.2.1/30

  - name: GigabitEthernet1
    ipv4:
      - address: 10.11.10.1/30

  - name: GigabitEthernet4
    ipv4:
      - address: 192.168.0.11/24

# 3. Bundle / LAG Member Assignments (cisco.ios.ios_lag_interfaces)
lag_interfaces:
  - name: Port-channel12
    members:
      - member: GigabitEthernet2
        mode: active

  - name: Port-channel11
    members:
      - member: GigabitEthernet3
        mode: active

# 4. IS-IS Routing Process Interface Bindings
isis_interfaces:
  - name: Loopback0
    passive: true
    circuit_type: level-2-only

  - name: Port-channel12
    point_to_point: true
    circuit_type: level-2-only

  - name: Port-channel11
    point_to_point: true
    circuit_type: level-2-only

  - name: GigabitEthernet1
    point_to_point: true
    circuit_type: level-2-only

